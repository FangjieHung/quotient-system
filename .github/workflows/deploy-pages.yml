name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0' # Angular 21 要求 Node 20.19+ 或 22.12+
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 用 --output-path 指定固定輸出資料夾，避免不確定的 dist 結構
      - name: Build Angular (set base-href & output-path)
        run: |
          npm run build -- \
          --configuration production \
            --base-href "/quotient-system/" \
            --deploy-url "/quotient-system/" \
            --output-path dist/quotient-system/browser

      # 放入 SPA 404 重導，避免子路徑重新整理 404
      - name: Add SPA 404 redirect
        run: |
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; URL=./index.html"></head><body></body></html>' \
            > dist/quotient-system/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/quotient-system/browser # ✅ 寫死為存在的資料夾

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
