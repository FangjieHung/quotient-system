name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0' # 或 '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 設定 base-href 指向 GitHub Pages 子路徑：/quotient-system/
      - name: Build Angular (set base-href)
        run: |
          npm run build -- --base-href "/quotient-system/"

      # 為 SPA 加入 404.html 轉回 index.html，避免子路徑重新整理 404
      - name: Add SPA 404 redirect
        run: |
          OUT=""
          if compgen -G "dist/*/browser" > /dev/null; then
            OUT=$(echo dist/*/browser)
          elif compgen -G "dist/*" > /dev/null; then
            OUT=$(echo dist/*)
          fi
          echo "Resolved output dir: $OUT"
          if [ -z "$OUT" ]; then
            echo "❌ 無法找到打包輸出資料夾，請檢查 angular.json 的 outputPath 或 build 指令"
            exit 1
          fi
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; URL=./index.html"></head><body></body></html>' > "$OUT/404.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 同時涵蓋 Angular 17+ 的 dist/<project>/browser 與舊版 dist/<project>
          path: |
            dist/*/browser
            dist/*

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
