<div class="container mx-auto max-w-4xl">
    <div class="mb-8 flex items-center gap-4">
        <a routerLink="/quotations"
            class="w-10 h-10 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-500 hover:text-sidebar hover:border-sidebar transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <h2 class="text-3xl font-bold text-primaryText">New Quotation</h2>
    </div>

    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden">
        <form [formGroup]="quotationForm" (ngSubmit)="onSubmit()" class="p-8">
            <!-- Basic Info -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="space-y-2">
                    <label class="block text-sm font-bold text-gray-700">Client Name</label>
                    <input type="text" formControlName="clientName"
                        class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:border-sidebar focus:ring-1 focus:ring-sidebar transition-all"
                        placeholder="e.g. Acme Corp">
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-bold text-gray-700">Project Title</label>
                    <input type="text" formControlName="projectTitle"
                        class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:border-sidebar focus:ring-1 focus:ring-sidebar transition-all"
                        placeholder="e.g. Website Redesign">
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-bold text-gray-700">Date</label>
                    <input type="date" formControlName="date"
                        class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:border-sidebar focus:ring-1 focus:ring-sidebar transition-all">
                </div>
            </div>

            <div class="h-px bg-gray-100 w-full mb-8"></div>

            <!-- Items -->
            <div class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-700">Line Items</h3>
                    <button type="button" (click)="addItem()"
                        class="text-sm font-bold text-sidebar hover:text-opacity-80 flex items-center gap-1">
                        <span class="material-symbols-outlined text-lg">add_circle</span>
                        Add Item
                    </button>
                </div>

                <div formArrayName="items" class="space-y-4">
                    <div *ngFor="let item of items.controls; let i=index" [formGroupName]="i"
                        class="flex flex-col md:flex-row gap-4 items-start bg-gray-50 p-4 rounded-xl relative group">
                        <div class="flex-1 w-full">
                            <label class="block text-xs font-bold text-gray-400 mb-1" *ngIf="i===0">Description</label>
                            <input type="text" formControlName="description"
                                class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-sidebar"
                                placeholder="Item description">
                        </div>
                        <div class="w-24">
                            <label class="block text-xs font-bold text-gray-400 mb-1" *ngIf="i===0">Qty</label>
                            <input type="number" formControlName="quantity"
                                class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-sidebar text-center">
                        </div>
                        <div class="w-32">
                            <label class="block text-xs font-bold text-gray-400 mb-1" *ngIf="i===0">Unit Price</label>
                            <input type="number" formControlName="unitPrice"
                                class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-sidebar text-right">
                        </div>
                        <div class="w-32 text-right pt-3 self-center font-bold text-gray-700">
                            {{ (item.get('quantity')?.value * item.get('unitPrice')?.value) | currency }}
                        </div>
                        <button type="button" (click)="removeItem(i)"
                            class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center shadow-sm opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="material-symbols-outlined text-sm">close</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Footer / Totals -->
            <div
                class="flex flex-col md:flex-row justify-between items-center bg-gray-50 p-6 rounded-xl border border-gray-100">
                <div class="text-sm text-gray-500 mb-4 md:mb-0">
                    <p>Grand Total is calculated automatically.</p>
                </div>
                <div class="text-right">
                    <p class="text-sm text-gray-400 font-bold uppercase tracking-wider">Total Amount</p>
                    <p class="text-3xl font-bold text-sidebar">{{ calculateTotal() | currency }}</p>
                </div>
            </div>

            <div class="mt-8 flex justify-end gap-4">
                <a routerLink="/quotations"
                    class="px-6 py-3 rounded-xl font-bold text-gray-500 hover:bg-gray-100 transition-colors">Cancel</a>
                <button type="submit" [disabled]="!quotationForm.valid"
                    class="bg-sidebar hover:bg-opacity-90 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-sidebar/20 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                    Create Quotation
                </button>
            </div>
        </form>
    </div>
</div>
